<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Playground — ThorVG</title>
  <meta name="description" content="ThorVG is a platform-independent library for drawing vector-based scenes and animations, including SVG and Lottie.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Google+Sans+Flex:opsz,wght@6..144,300..700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/playground-example.css">
</head>
<body class="page-example">
  <header class="site-header is-hidden">
    <div class="container header-inner">
      <a href="index.html" class="logo"><img src="assets/images/thorvg-logo.svg" alt="ThorVG" class="logo-img"></a>
      <nav class="main-nav" id="main-nav">
        <a href="about.html">About</a>
        <a href="showcase.html">Showcase</a>
        <a href="tutorial.html">Tutorial</a>
        <a href="api.html">API</a>
        <a href="https://deepwiki.com/thorvg/thorvg" target="_blank" rel="noopener" class="nav-external">DeepWiki<span class="external-icon">&#8599;</span></a>
        <a href="blogs.html">Blogs</a>
        <a href="https://github.com/thorvg/thorvg/releases" target="_blank" rel="noopener" class="nav-external">Releases<span class="external-icon">&#8599;</span></a>
        <a href="playground.html" class="active">Playground</a>
        <a href="view.html">View</a>
      </nav>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="main-nav">
        <img src="assets/icons/menu.svg" alt="" class="menu-icon">
      </button>
    </div>
  </header>

  <main>
    <section class="page-content">
      <div class="container">
        <a href="playground.html" class="example-back-link">
          &larr; Back to Playground
        </a>

        <div class="example-header" id="example-header">
          <div class="example-header-top">
            <h2 id="example-title">Loading&hellip;</h2>
            <span class="playground-card-tag" id="example-category"></span>
          </div>
          <p class="page-lede example-description" id="example-description"></p>
        </div>

        <div class="example-code-panel is-pinned-top" id="example-code-panel">
          <div class="example-code-panel-col example-code-panel-preview">
            <div class="example-code-panel-header">
              <span class="example-code-panel-header-label">Canvas Preview</span>
              <div class="example-code-panel-header-actions">
                <div class="example-zoom-control">
                  <input type="range" id="example-zoom-slider" min="50" max="200" step="10" value="100">
                  <output class="example-zoom-popup" id="example-zoom-popup" for="example-zoom-slider">100%</output>
                </div>
                <button type="button" class="example-copy-code-btn" id="example-preview-clear-btn">
                  <span class="example-copy-code-label">Clear</span>
                </button>
                <button type="button" class="example-copy-code-btn" id="example-preview-run-btn" disabled>
                  <span class="example-copy-code-label">Run</span>
                </button>
              </div>
            </div>
            <div class="example-canvas-preview">
              <canvas id="example-canvas" width="600" height="600" class="example-canvas" hidden></canvas>
              <div class="example-preview-toast" id="example-preview-toast"></div>
            </div>
          </div>
          <div class="example-code-panel-col example-code-panel-code">
            <div class="example-code-panel-header">
              <span class="example-code-panel-header-label">Code Editor</span>
              <div class="example-code-panel-header-actions">
                <label class="example-auto-run-toggle">
                  <input type="checkbox" id="example-auto-run-checkbox" checked>
                  Auto Run
                </label>
                <button type="button" class="example-copy-code-btn example-run-code-btn" id="example-run-code-btn">
                  <span class="example-copy-code-label">Run</span>
                </button>
                <button type="button" class="example-copy-code-btn" id="example-reset-code-btn">
                  <span class="example-copy-code-label">Reset</span>
                </button>
                <button type="button" class="example-copy-code-btn" id="example-copy-code-btn">
                  <span class="example-copy-code-label" id="example-copy-code-label">Copy</span>
                </button>
              </div>
            </div>
            <pre class="code-block"><code class="example-line-numbers" id="example-line-numbers" aria-hidden="true">1</code><code id="example-code-content" contenteditable="plaintext-only" spellcheck="false"></code><span class="example-copy-toast" id="example-copy-toast">Code copied to clipboard</span></pre>
          </div>
        </div>

        <nav class="example-pagination">
          <a class="example-pagination-link" id="example-prev-link" href="playground.html" hidden>
            <span class="example-pagination-label">&larr; Previous</span>
            <span class="example-pagination-title" id="example-prev-title"></span>
          </a>
          <span class="example-pagination-count" id="example-count"></span>
          <a class="example-pagination-link is-next" id="example-next-link" href="playground.html" hidden>
            <span class="example-pagination-label">Next &rarr;</span>
            <span class="example-pagination-title" id="example-next-title"></span>
          </a>
        </nav>
      </div>
    </section>
  </main>

  <script src="assets/js/playground-data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/playground-example.js"></script>
</body>
</html>
