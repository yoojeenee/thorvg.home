<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1500" viewBox="0 0 1400 1500">
  <defs>
    <filter id="blur-l" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="blur-m" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blur-s" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <!-- Soft outer halo: pale yellow -->
  <ellipse cx="700" cy="720" rx="470" ry="520" fill="#e4e895" filter="url(#blur-l)"/>

  <!-- Lime green -->
  <ellipse cx="700" cy="800" rx="390" ry="420" fill="#b0c650" filter="url(#blur-l)"/>

  <!-- Mid green -->
  <ellipse cx="700" cy="900" rx="320" ry="340" fill="#7d9c3b" filter="url(#blur-m)"/>

  <!-- Deep green core -->
  <ellipse cx="700" cy="1070" rx="230" ry="200" fill="#31492a" filter="url(#blur-s)"/>
</svg>
