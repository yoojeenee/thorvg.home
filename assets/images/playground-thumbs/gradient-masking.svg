<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="gm-1" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="gm-2" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#01ffff"/>
    </linearGradient>
    <linearGradient id="gm-3" x1="0" y1="300" x2="300" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="gm-4" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#01ffff"/>
    </linearGradient>

    <clipPath id="gm-clip1"><circle cx="150" cy="150" r="93.75"/></clipPath>
    <clipPath id="gm-clip2"><circle cx="450" cy="150" r="93.75"/></clipPath>

    <mask id="gm-invmask3">
      <rect x="0" y="300" width="300" height="300" fill="#ffffff"/>
      <circle cx="150" cy="450" r="93.75" fill="#000000"/>
    </mask>
    <mask id="gm-invmask4">
      <path transform="translate(300,300)" fill="#ffffff"
        d="M149.25,25.5 L189.75,107.25 L280.5,120 L215.25,183 L230.25,273.75 L149.25,231.75 L72.75,273.75 L84,183.75 L19.5,120.75 L109.5,107.25 Z"/>
      <circle cx="450" cy="450" r="93.75" fill="#000000"/>
    </mask>
  </defs>

  <rect x="0" y="0" width="600" height="600" fill="#ffffff"/>

  <!-- Solid rect, Alpha-masked (= clipped) to a circle -->
  <g clip-path="url(#gm-clip1)">
    <rect x="0" y="0" width="300" height="300" fill="url(#gm-1)"/>
  </g>

  <!-- Star, Alpha-masked (= clipped) to a circle -->
  <g clip-path="url(#gm-clip2)">
    <path transform="translate(300,0)" fill="url(#gm-2)"
      d="M149.25,25.5 L189.75,107.25 L280.5,120 L215.25,183 L230.25,273.75 L149.25,231.75 L72.75,273.75 L84,183.75 L19.5,120.75 L109.5,107.25 Z"/>
  </g>

  <!-- Solid rect, InvAlpha-masked: circular hole cut out -->
  <rect x="0" y="300" width="300" height="300" fill="url(#gm-3)" mask="url(#gm-invmask3)"/>

  <!-- Star, InvAlpha-masked: circular hole cut out -->
  <path transform="translate(300,300)" fill="url(#gm-4)" mask="url(#gm-invmask4)"
    d="M149.25,25.5 L189.75,107.25 L280.5,120 L215.25,183 L230.25,273.75 L149.25,231.75 L72.75,273.75 L84,183.75 L19.5,120.75 L109.5,107.25 Z"/>
</svg>
